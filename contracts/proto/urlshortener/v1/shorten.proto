syntax = "proto3";

package urlshortener.v1;

// ShortenRequest is the public request body accepted by the core API gateway.
message ShortenRequest {
  string url = 1;
}

// InternalShortenRequest is the body core forwards to shortener-service over
// the internal HTTP hop. It carries the authenticated user_id resolved from the
// JWT, since the downstream service trusts core to have authenticated.
message InternalShortenRequest {
  string url = 1;
  string user_id = 2;
}

// ShortenResponse is returned to the caller once the shortening request has been
// accepted. The key is computed synchronously and is deterministic, so it can be
// returned immediately even though persistence happens asynchronously via the
// url.created queue. id correlates the response with the emitted UrlCreatedEvent.
message ShortenResponse {
  string id = 1;
  string shortened_url_key = 2;
  string long_url = 3;
}
