name: proto

on:
  pull_request:
    paths:
      - "contracts/**"
      - ".github/workflows/proto.yml"
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - ".github/workflows/proto.yml"

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `buf breaking --against origin/main` can compare.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - uses: bufbuild/buf-setup-action@v1

      # buf.gen.yaml uses a local protoc-gen-go plugin, so it must be on PATH
      # for the generate/drift check below.
      - name: Install protoc-gen-go
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Lint protobuf
        working-directory: contracts
        run: buf lint

      - name: Check for breaking changes against main
        working-directory: contracts
        run: buf breaking --against ".git#ref=origin/main,subdir=contracts"

      # Fail if generated Go has drifted from the .proto sources.
      - name: Verify generated code is up to date
        working-directory: contracts
        run: |
          buf generate
          git diff --exit-code -- gen
